<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2P Online Chess</title>

  <!-- Modern cm-chessboard CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.5.0/assets/chessboard.css"/>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .card {
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
      border-radius: 4px;
      width: 55%;
      margin-right: 5px;
    }

    button {
      padding: 10px 15px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #45a049;
    }

    #status {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffca28;
    }

    #board {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>P2P WebRTC Chess</h1>

  <div class="card">
    <p id="peer-id-display">Your Player ID: <i>Connecting...</i></p>
    <div style="margin-bottom: 12px;">
      <button onclick="createGame()">Create New Game</button>
    </div>
    <div>
      <input type="text" id="join-id-input" placeholder="Enter Host Game ID" />
      <button onclick="joinGame()">Join Game</button>
    </div>
  </div>

  <div class="card">
    <div id="status">Status: Waiting for game connection...</div>
    <div id="board"></div>
  </div>
</div>

<!-- Dependencies: PeerJS & Chess.js -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0-beta.6/chess.min.js"></script>

<script type="module">
  import { Chessboard, COLOR, INPUT_EVENT_TYPE } from "https://cdn.jsdelivr.net/npm/cm-chessboard@8.5.0/src/Chessboard.js";
  import { PIECES_SVG_MODERN } from "https://cdn.jsdelivr.net/npm/cm-chessboard@8.5.0/src/cm-chessboard/assets/pieces-svg-modern.js";

  let board = null;
  let game = new Chess();
  let peer = null;
  let conn = null;
  let playerColor = COLOR.white;

  const $status = document.getElementById("status");
  const $peerIdDisplay = document.getElementById("peer-id-display");

  // Initialize Board
  async function initBoard() {
    board = new Chessboard(document.getElementById("board"), {
      position: game.fen(),
      sprite: { url: PIECES_SVG_MODERN },
      orientation: COLOR.white,
      responsive: true
    });

    board.enableMoveInput(inputHandler, playerColor);
  }

  // Handle Board Input / Moves
  function inputHandler(event) {
    if (event.type === INPUT_EVENT_TYPE.moveStarted) {
      // Return true if it's the correct player's turn to move this piece
      const piece = game.get(event.square);
      if (piece && ((game.turn() === 'w' && piece.color === 'w' && playerColor === COLOR.white) ||
                    (game.turn() === 'b' && piece.color === 'b' && playerColor === COLOR.black))) {
        return true;
      }
      return false;
    } else if (event.type === INPUT_EVENT_TYPE.validateMove) {
      const move = {
        from: event.squareFrom,
        to: event.squareTo,
        promotion: 'q'
      };
      const result = game.move(move);
      if (result) {
        board.setPosition(game.fen(), true);
        if (conn && conn.open) {
          conn.send({ type: 'move', move: move });
        }
        updateStatus();
        return true;
      }
      return false;
    }
  }

  // PeerJS Setup
  window.initPeer = function() {
    peer = new Peer();

    peer.on('open', (id) => {
      $peerIdDisplay.innerHTML = `Your Game ID: <b style="color: #4caf50;">${id}</b>`;
    });

    peer.on('connection', (connection) => {
      conn = connection;
      playerColor = COLOR.white;
      setupConnectionHandlers();
      $status.innerText = "Friend connected! You play White. Your turn.";
      board.setOrientation(COLOR.white);
      game.reset();
      board.setPosition(game.fen(), true);
      board.enableMoveInput(inputHandler, playerColor);
    });
  };

  window.createGame = function() {
    if (!peer || !peer.id) return alert("Peer service loading, please wait...");
    alert(`Share your Game ID (${peer.id}) with your friend!`);
  };

  window.joinGame = function() {
    const hostId = document.getElementById("join-id-input").value.trim();
    if (!hostId) return alert("Please enter a valid Game ID.");

    conn = peer.connect(hostId);
    playerColor = COLOR.black;
    setupConnectionHandlers();
    $status.innerText = "Connecting to host...";
  };

  function setupConnectionHandlers() {
    conn.on('open', () => {
      if (playerColor === COLOR.black) {
        $status.innerText = "Connected! You play Black. Waiting for White's move.";
        board.setOrientation(COLOR.black);
        game.reset();
        board.setPosition(game.fen(), true);
        board.enableMoveInput(inputHandler, playerColor);
      }
    });

    conn.on('data', (data) => {
      if (data.type === 'move') {
        game.move(data.move);
        board.setPosition(game.fen(), true);
        updateStatus();
      }
    });

    conn.on('close', () => {
      $status.innerText = "Connection closed by opponent.";
    });
  }

  function updateStatus() {
    let moveColor = game.turn() === 'b' ? 'Black' : 'White';
    if (game.isCheckmate()) {
      $status.innerText = `Game over, ${moveColor} is in checkmate.`;
    } else if (game.isDraw()) {
      $status.innerText = 'Game over, drawn position.';
    } else {
      let text = `${moveColor} to move`;
      if (game.isCheck()) text += ` (${moveColor} is in check!)`;
      $status.innerText = text;
    }
  }

  // Initialize on load
  initBoard();
  initPeer();
</script>

</body>
</html>
